services:
  cadent:
    build: .
    ports:
      # Localhost only: phones reach it through `tailscale serve`, whose identity header guards Settings › Garmin.
      - "127.0.0.1:3000:3000"
    volumes:
      - cadent-data:/app/data
    environment:
      # Same zone as TIME_ZONE in src/lib/plan.ts (see DECISIONS.md).
      TZ: America/Toronto
      CADENT_DB: ${CADENT_DB:-/app/data/cadent.db}
      GARMINTOKENS: ${GARMINTOKENS:-/app/data/garmin-tokens}
      CADENT_OWNER: ${CADENT_OWNER:-}
      # The Claude connector (docs/home-server.md): off while either is empty.
      CADENT_URL: ${CADENT_URL:-}
      CADENT_PUBLIC_URL: ${CADENT_PUBLIC_URL:-}
    restart: unless-stopped

volumes:
  cadent-data:
