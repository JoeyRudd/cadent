services:
  cadent:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - cadent-data:/app/data
    environment:
      # Same zone as TIME_ZONE in src/lib/plan.ts (see DECISIONS.md).
      TZ: America/Toronto
      CADENT_DB: ${CADENT_DB:-/app/data/cadent.db}
      GARMINTOKENS: ${GARMINTOKENS:-/app/data/garmin-tokens}
      GARMIN_EMAIL: ${GARMIN_EMAIL:-}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD:-}
    restart: unless-stopped

volumes:
  cadent-data:
