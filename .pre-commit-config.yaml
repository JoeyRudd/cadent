repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-lint
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: protected-tests
        name: no skipped tests in protected suites
        entry: bash -c '! grep -nE "pytest.mark.skip|@skip|xfail|pytest.skip\(|importorskip" core/tests/*.py'
        language: system
        pass_filenames: false
