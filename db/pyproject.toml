[project]
name = "cadent-db"
version = "0.1.0"
description = "Cadent database: SQLAlchemy models and Alembic migrations (see docs/decisions/012-db-package.md)."
requires-python = ">=3.12"
dependencies = [
    "cadent-core",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
cadent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadent_db"]
