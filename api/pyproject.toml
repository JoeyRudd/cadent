[project]
name = "cadent-api"
version = "0.1.0"
description = "Cadent HTTP API: REST for the web app, and later the MCP endpoint and OAuth."
requires-python = ">=3.12"
dependencies = [
    "cadent-core",
    "cadent-db",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "structlog>=24.4",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[tool.uv.sources]
cadent-core = { workspace = true }
cadent-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadent_api"]
