[project]
name = "cadent"
version = "0.1.0"
description = "Self-hosted running coach: Garmin sync, plan safety engine, MCP analysis."
requires-python = ">=3.12"
license = "MIT"

[tool.uv.workspace]
members = ["core", "api", "db"]

[tool.uv.sources]
cadent-core = { workspace = true }
cadent-api = { workspace = true }
cadent-db = { workspace = true }

[dependency-groups]
dev = [
    "cadent-core",
    "cadent-api",
    "cadent-db",
    "ruff>=0.7",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "httpx>=0.27",
    "import-linter>=2.1",
    "vulture>=2.13",
    "pre-commit>=4.0",
    "testcontainers[postgres]>=4.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C90", "N", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations are one long list of operations.
"db/migrations/versions/*" = ["PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["cadent_core", "cadent_api", "cadent_db"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 30

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["core/src", "api/src", "db/src"]
include = ["core/src", "core/tests", "api/src", "api/tests", "db/src", "db/tests", "db/migrations"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "api/tests", "db/tests", ".claude/hooks"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["cadent_core"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.importlinter]
root_packages = ["cadent_core", "cadent_api", "cadent_db"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core is pure: it never imports the API or any I/O layer"
type = "forbidden"
source_modules = ["cadent_core"]
forbidden_modules = [
    "cadent_api",
    "cadent_db",
    "fastapi",
    "sqlalchemy",
    "alembic",
    "psycopg",
    "httpx",
    "garminconnect",
]

[tool.vulture]
paths = ["core/src", "api/src", "db/src"]
min_confidence = 80
