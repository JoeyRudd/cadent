<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cadent</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; text-align: center;
        font-family: system-ui, sans-serif; background: light-dark(#f4f5ef, #141a17); color: light-dark(#20271f, #ecf0ec); }
      p { margin: 0.5rem 0 0; color: light-dark(#5d665b, #a0aaa3); }
      button { margin-top: 1.5rem; min-height: 48px; padding: 0 1.5rem; border: 0; border-radius: 14px; font: inherit; font-weight: 600;
        background: light-dark(#277a70, #5fb3a7); color: light-dark(#ffffff, #0f2420); }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Cadent can't reach its server. Check your connection, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
